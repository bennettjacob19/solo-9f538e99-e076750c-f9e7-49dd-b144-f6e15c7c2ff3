services:
  receiver-a:
    build: ./receiver
    container_name: telemetry-receiver-a
    environment:
      RECEIVER_NAME: A
      LISTEN_PORT: "9001"
      REPLY_DELAY: "0"          # 默认回包延迟（秒）；报文 "DELAY:<秒>:" 可单次覆盖
    networks: [telemetry]

  receiver-b:
    build: ./receiver
    container_name: telemetry-receiver-b
    environment:
      RECEIVER_NAME: B
      LISTEN_PORT: "9001"
      REPLY_DELAY: "0"
    networks: [telemetry]

  quota:
    build: ./quota
    container_name: telemetry-quota
    environment:
      HTTP_PORT: "8081"
      DB_PATH: /data/quota.db            # 保存版/待应用版持久化（重启保留并继续应用）
      PROXY_BASE_URL: http://proxy:8080  # 代理管理接口
      QUOTA_TOKEN: "quota-shared-secret"
      SYNC_INTERVAL: "2"
    ports:
      - "8081:8081"                      # 配额控制网页
    volumes:
      - quota-data:/data
    # 与 proxy 互相重试启动，无需 depends_on 排序
    networks: [telemetry]

  proxy:
    build: ./proxy
    container_name: telemetry-proxy
    environment:
      UDP_LISTEN_PORT: "9000"
      HTTP_PORT: "8080"
      SESSION_IDLE_TIMEOUT: "5"          # 会话空闲超时（秒）
      RECEIVER_A_HOST: receiver-a
      RECEIVER_A_PORT: "9001"
      RECEIVER_B_HOST: receiver-b
      RECEIVER_B_PORT: "9001"
      DB_PATH: /data/proxy.db            # 目标接收器持久化（重启保留）
      QUOTA_SERVICE_URL: http://quota:8081   # 配额控制服务；启动须先拉到保存版
      QUOTA_TOKEN: "quota-shared-secret"
      # UPSTREAM_PORT_COOLDOWN: "30"     # 上游端口冷却，须大于最大回包延迟
    ports:
      - "9000:9000/udp"                  # 遥测终端发往这里
      - "8080:8080"                      # 代理操作网页
    volumes:
      - proxy-data:/data
    depends_on:
      - receiver-a
      - receiver-b
    networks: [telemetry]

networks:
  telemetry:

volumes:
  proxy-data:
  quota-data:
